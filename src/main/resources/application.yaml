spring:
  application:
    name: lendme

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: LendmeHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      auto-commit: false          # let Spring/Hibernate manage transactions
      connection-timeout: 30000   # ms to wait for a connection
      idle-timeout: 600000        # ms before an idle connection is retired
      max-lifetime: 1800000       # ms max lifetime of a connection

  jpa:
    hibernate:
      ddl-auto: validate      # Hibernate no longer changes the schema
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true # needed because your DB already has tables
    baseline-version: 0

lendme:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: lendme
      access-token-ttl: 15m
      refresh-token-ttl: 30d
    login:
      max-failed-attempts: 5
      lock-duration: 15m

  logging:
    level:
      org.hibernate.orm.connections.pooling: WARN
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true   # keep the Bearer token across page reloads
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json
